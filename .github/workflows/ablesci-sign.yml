name: AbleSci Auto Sign

on:
  workflow_dispatch:
  schedule:
    - cron: '40 13,23 * * *'  # UTC时间(北京时间为21:40和次日7:40)

permissions:
  contents: read

concurrency:
  group: ablesci-sign
  cancel-in-progress: false

jobs:
  sign:
    # 固定到 24.04，避免 ubuntu-latest 迁移到 26.04 时出现运行时变化
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run AbleSci Sign
        # 签到失败时脚本以非零退出，本步骤和整个运行会显示为失败（GitHub 会发邮件提醒）
        run: |
          set +e
          python -u ablesci.py 2>&1 | tee output.log
          status=${PIPESTATUS[0]}
          {
            echo '### 科研通签到日志'
            echo '```'
            cat output.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
        env:
          GITHUB_ACTIONS: true
          ABLESCI_ACCOUNTS: ${{ secrets.ABLESCI_ACCOUNTS }}
          # SCKEY: ${{ secrets.SCKEY }}          # Server酱
          # XZKEY: ${{ secrets.XZKEY }}          # 息知
          PUSH_PLUS_TOKEN: ${{ secrets.PUSH_PLUS_TOKEN }} # PushPlus (按需启用)
