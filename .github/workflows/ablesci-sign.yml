name: AbleSci Auto Sign

on:
  workflow_dispatch:
  schedule:
    - cron: '40 13,23 * * *'  # UTC时间(北京时间为21:40和次日7:40)

permissions:
  contents: read
  actions: write

jobs:
  sign:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run AbleSci Sign
        # 签到失败时脚本以非零退出，本步骤和整个运行会显示为失败（GitHub 会发邮件提醒）
        run: |
          set -o pipefail
          python ablesci.py 2>&1 | tee output.log
          {
            echo '### 科研通签到日志'
            echo '```'
            cat output.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          GITHUB_ACTIONS: true
          ABLESCI_ACCOUNTS: ${{ secrets.ABLESCI_ACCOUNTS }}
          # SCKEY: ${{ secrets.SCKEY }}          # Server酱
          # XZKEY: ${{ secrets.XZKEY }}          # 息知
          PUSH_PLUS_TOKEN: ${{ secrets.PUSH_PLUS_TOKEN }} # PushPlus (按需启用)

  keepalive:
    # 防止仓库 60 天无提交后 GitHub 自动停用定时任务
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Keep workflow enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/ablesci-sign.yml/enable"
